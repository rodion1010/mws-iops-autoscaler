name: E2E (smoke)

# The smoke tier reuses one persistent target and runs PR code on a credentialed
# runner, so it runs only for branches of this repository. pull_request_target
# loads this file from the base branch, so a PR cannot edit away the origin
# guard below; fork PRs get a GitHub-hosted notice job and their code is never
# checked out. vars.MWS_PROJECT exists only in the private CI repository, so the
# public mirror never queues a job for the runner.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  fork-skipped:
    if: github.event.pull_request.head.repo.full_name != github.repository || vars.MWS_PROJECT == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Live e2e runs only for branches of the private CI repository; a maintainer reviews the change and runs it from a branch there."

  # Lists the PR's files through the API, without checking out PR code. Any doubt (API error,
  # incomplete list, no files, a rename out of code) leaves docs_only=false, so smoke runs.
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.MWS_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          docs_only=false
          files="$RUNNER_TEMP/pr-files.tsv"
          # One line per file: new name, then old name (same for non-renames). Files, not pipes:
          # under pipefail an early-exiting grep turns SIGPIPE into a false "docs only".
          if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // .filename)] | @tsv' >"$files"; then
            count=$(grep -c . "$files" || true)
            tr '\t' '\n' <"$files" >"$files.names"
            status=0
            grep -vE '(\.md$|^docs/|^LICENSE$)' "$files.names" >/dev/null || status=$?
            # Only grep exit 1 (no other path) means docs only; 0 is a code path, >1 an error.
            if [ "$count" -gt 0 ] && [ "$count" = "$CHANGED" ] && [ "$status" -eq 1 ]; then
              docs_only=true
              echo "::notice::Smoke skipped: this PR changes only documentation (*.md, docs/**, LICENSE)."
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  smoke:
    needs: changes
    # !cancelled(), not the default success(): a failed classifier must run smoke, not skip it.
    if: >-
      !cancelled() && needs.changes.outputs.docs_only != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository && vars.MWS_PROJECT != ''
    runs-on: [self-hosted, mws-iops-autoscaler-runner]
    # All smoke runs share one target and must execute serially. queue: max keeps
    # up to 100 pending runs instead of one, so a new PR does not cancel another's.
    concurrency:
      group: e2e-smoke-vm
      cancel-in-progress: false
      queue: max
    # A job-level kill runs no cleanup, so this must exceed the sum of every TestSmoke_*
    # worst-case context; recompute before shrinking it or adding a scenario.
    timeout-minutes: 73
    steps:
      # Pin third-party actions because this runner has cloud credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target checks out the base branch by default. Test the PR merged into
          # it, as pull_request did; the guard on this job makes the PR head a branch of this
          # repository.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      # GitHub stops updating the merge ref while a PR has conflicts, so it can lag the head.
      - name: Refuse a stale merge ref
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]; then
            echo "::error::refs/pull/N/merge does not contain the PR head $HEAD_SHA — resolve conflicts with the base branch, then re-run."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The persistent runner already retains its module cache.
          cache: false

      - name: Write SSH key
        run: |
          umask 077
          printf '%s\n' "${{ secrets.E2E_SSH_PRIVATE_KEY }}" > "${RUNNER_TEMP}/e2e_ssh_key"
          chmod 600 "${RUNNER_TEMP}/e2e_ssh_key"

      - name: Run smoke e2e
        env:
          MWS_PROJECT: ${{ vars.MWS_PROJECT }}
          MWS_ZONE: ${{ vars.MWS_ZONE }}
          E2E_VM_NAME: ${{ vars.E2E_SMOKE_VM_NAME }}
          E2E_DEVICE_NAME: ${{ vars.E2E_SMOKE_DEVICE_NAME }}
          E2E_SMOKE_INDEPENDENT_DEVICE_NAME: ${{ vars.E2E_SMOKE_INDEPENDENT_DEVICE_NAME }}
          E2E_SSH_HOST: ${{ vars.E2E_SMOKE_SSH_HOST }}
          E2E_SSH_USER: ${{ vars.E2E_SSH_USER }}
          E2E_SSH_KEY_PATH: ${{ runner.temp }}/e2e_ssh_key
        # The harness builds the agent dynamically, so cached test results are unsafe.
        # -timeout stays below timeout-minutes. No backstop teardown: Preflight resets the shared
        # target at the start of every scenario.
        run: go test -count=1 -timeout=68m -tags e2e ./e2e/... -run 'TestSmoke|TestRegression' -v

      - name: Remove SSH key
        if: always()
        run: rm -f "${RUNNER_TEMP}/e2e_ssh_key"
